<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Kizora product image placeholder">
  <defs>
    <linearGradient id="kz-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="48%" stop-color="#B3299C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <radialGradient id="kz-glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="#F3F0FA"/>
  <circle cx="400" cy="320" r="300" fill="url(#kz-glow)"/>

  <!-- Backpack glyph -->
  <g transform="translate(400 360)" fill="none" stroke="url(#kz-grad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-120 -70 a120 120 0 0 1 240 0" opacity="0.55"/>
    <rect x="-150" y="-60" width="300" height="320" rx="60"/>
    <path d="M-150 70 h300"/>
    <rect x="-70" y="20" width="140" height="120" rx="26" fill="#F3F0FA"/>
  </g>

  <text x="400" y="700" text-anchor="middle" font-family="'Sora','Segoe UI',sans-serif" font-size="64" font-weight="800" fill="url(#kz-grad)" letter-spacing="2">Kizora</text>
  <text x="400" y="745" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="26" font-weight="600" fill="#6B6580" letter-spacing="4">PRODUCT IMAGE</text>
</svg>
